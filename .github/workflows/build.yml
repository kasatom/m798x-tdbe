name: Build OpenWrt with TUN Module

on:
  workflow_dispatch:
    inputs:
      debug_level:
        description: 'Debug level'
        default: '1'
        type: choice
        options:
        - '1'
        - '2'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    
    steps:
    - name: Set up Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: 24
        
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 0
    
    - name: Install dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          build-essential git libncurses5-dev libncursesw5-dev \
          zlib1g-dev gawk flex gettext wget unzip python3 python3-pip \
          python3-dev python3-setuptools libssl-dev rsync ccache ecj \
          fastjar binwalk file bsdmainutils jq moreutils
    
    - name: Configure TUN module
      run: |
        echo "🔧 Configuring TUN module..."
        if [ -f .config ]; then
          echo "✅ Using existing .config file"
          cp .config .config.backup
        else
          echo "🔄 Creating default configuration"
          make defconfig
        fi
        echo "CONFIG_PACKAGE_kmod-tun=y" >> .config
        echo "CONFIG_PACKAGE_kmod-iptunnel=y" >> .config
        echo "CONFIG_PACKAGE_kmod-ip6-tunnel=y" >> .config
        echo "CONFIG_PACKAGE_kmod-wireguard=y" >> .config
        echo "CONFIG_KERNEL_TUN=y" >> .config
        make oldconfig
        echo "✅ TUN module configuration completed"
    
    - name: Build firmware
      id: build_step
      run: |
        echo "🚀 Starting build..."
        ulimit -v 6291456  # 6GB memory limit
        mkdir -p build_logs
        
        # Simple build command with error capture
        set +e
        if [ "${{ github.event.inputs.debug_level }}" = "1" ]; then
          make -j2 V=s 2>&1 | tee build_logs/build.log
        else
          make -j2 V=s 2>&1 | tee build_logs/build.log
        fi
        BUILD_EXIT_CODE=$?
        set -e
        
        # Create simple error report
        echo "Exit code: $BUILD_EXIT_CODE" > build_logs/summary.log
        if [ $BUILD_EXIT_CODE -ne 0 ]; then
          echo "❌ BUILD FAILED" >> build_logs/summary.log
          grep -iE "error|fail|fatal" build_logs/build.log | head -20 > build_logs/errors.log
        else
          echo "✅ BUILD SUCCEEDED" >> build_logs/summary.log
          find bin/targets/ -name "*.bin" >> build_logs/summary.log 2>/dev/null || true
        fi
        
        echo "build_exit_code=$BUILD_EXIT_CODE" >> $GITHUB_OUTPUT
        echo "✅ Build process completed"
    
    - name: Upload logs and artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-results
        path: |
          build_logs/summary.log
          build_logs/errors.log
          build_logs/build.log
          .config
    
    - name: Upload firmware
      if: steps.build_step.outputs.build_exit_code == '0'
      uses: actions/upload-artifact@v4
      with:
        name: firmware
        path: bin/targets/*/*/*.bin
