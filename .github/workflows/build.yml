name: Build OpenWrt with TUN Module

on:
  workflow_dispatch:  # 允许手动触发
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      BUILD_THREADS: 4  # 根据GitHub Actions限制调整
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git libncurses5-dev libncursesw5-dev \
        zlib1g-dev gawk flex gettext wget unzip python3 python3-pip python3-dev \
        python3-setuptools libssl-dev rsync ccache ecj fastjar
        
    - name: Configure build with TUN module
      run: |
        # 备份原始配置
        cp .config .config.backup || true
        
        # 启用TUN模块（关键步骤！）
        echo "CONFIG_PACKAGE_kmod-tun=y" >> .config
        echo "CONFIG_PACKAGE_kmod-iptunnel=y" >> .config
        echo "CONFIG_PACKAGE_kmod-ip6-tunnel=y" >> .config
        
        # 验证配置是否生效
        grep -E "kmod-tun|CONFIG_TUN" .config || echo "TUN module enabled successfully"
    
    - name: Build firmware
      run: |
        # 清理旧构建（可选）
        make clean
        
        # 开始编译（使用适当线程数）
        make -j${BUILD_THREADS} V=s
        
        # 验证编译结果
        find bin/targets/ -name "*.bin" -exec ls -la {} \;
    
    - name: Verify TUN module in firmware
      run: |
        # 检查生成的固件是否包含tun模块
        for firmware in bin/targets/*/*/*.bin; do
          echo "=== Checking firmware: $firmware ==="
          # 使用binwalk分析固件内容
          binwalk "$firmware" | grep -i tun || echo "TUN module may be included"
        done
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-with-tun-${{ github.sha }}
        path: |
          bin/targets/*/*/*.bin
          bin/targets/*/*/*.manifest
          bin/targets/*/*/*.tar.gz
        retention-days: 30
    
    - name: Create release (optional)
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        files: bin/targets/*/*/*.bin
        tag_name: v1.0-with-tun
        name: OpenWrt with TUN Module
        body: |
          Custom build with TUN module enabled for Tenda BE12 Pro (BE7200)
          - kmod-tun enabled
          - kmod-iptunnel enabled  
          - kmod-ip6-tunnel enabled
